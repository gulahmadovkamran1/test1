<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarTap</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* Profil şəklinin stili */
    .avatar-img {
      width: 100px;
      height: 100px;
      object-fit: contain; /* Şəklin nisbətini pozmadan yerləşdirir */
      border-radius: 50%;
      margin: 0 auto 15px auto;
      display: block;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #111;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      color: #212529;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .link-btn:active {
      transform: scale(0.98);
      background: #e9ecef;
    }

    @media (hover: hover) {
      .link-btn:hover {
        background: #007aff;
        color: #ffffff;
        border-color: #007aff;
        box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Profil şəkli bura əlavə edildi -->
    <img src="startaplogo" alt="StarTap Logo" class="avatar-img">
    
    <h1>Xoş Gəlmisiniz</h1>
    <p>Aşağıdakı linklərdən istədiyinizə keçid edə bilərsiniz:</p>

    <div class="links-container">
      <a href="https://google.com" target="_blank" class="link-btn">Google Rəy Yazın</a>
      <a href="https://instagram.com" target="_blank" class="link-btn">Instagram Səhifəsi</a>
      <a href="https://whatsapp.com" target="_blank" class="link-btn">WhatsApp İlə Əlaqə</a>
      <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn Profil</a>
    </div>
  </div>

</body>
</html>
